<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>划卡选句</title>
<style>
  :root{
    --bg:#FAF9F6; --card:#FFFDF8; --line:#E7E3DA; --line-2:#D6D0C4;
    --ink:#2B2A27; --ink-2:#6B6862; --ink-3:#9A958C;
    --accent:#34506B; --accent-soft:#EDF1F6;
    --keep:#3B6D11; --drop:#8A5A0B;
    --a:#3B6D11; --a-bg:#F0F5E6;
    --b:#8A5A0B; --b-bg:#FBF2E0;
    --c:#6B6862; --c-bg:#F1EFE9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  .top{padding:22px 32px 0; max-width:980px; margin:0 auto}
  .top-row{display:flex; align-items:baseline; gap:12px; margin-bottom:14px}
  .top-row h1{font-size:17px; font-weight:600; margin:0; letter-spacing:.02em}
  .top-row .hint{font-size:12px; color:var(--ink-3)}
  .top-row .spacer{flex:1}
  .toolbar{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
  .seg{display:flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; background:#fff}
  .seg button{border:0; background:transparent; padding:6px 12px; font-size:12.5px; color:var(--ink-2);
    cursor:pointer; font-family:inherit; border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent); color:#fff}
  .seg button:hover:not(.on){background:#F4F2ED}
  input[type=search]{flex:1; min-width:120px; max-width:230px; padding:7px 11px; font-size:12.5px;
    border:1px solid var(--line-2); border-radius:8px; background:#fff; font-family:inherit;
    color:var(--ink); outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  .ghost{border:1px solid var(--line-2); background:transparent; color:var(--ink-2);
    padding:6px 12px; font-size:12.5px; border-radius:8px; cursor:pointer; font-family:inherit}
  .ghost:hover{background:#F4F2ED}
  .ghost:disabled{opacity:.4; cursor:default}

  .stage{position:absolute; left:0; right:0; top:132px; bottom:118px;
    display:flex; align-items:center; justify-content:center}
  .deck{position:relative; width:min(560px,88vw); height:min(360px,52vh)}
  .card{position:absolute; inset:0; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:26px 34px 22px; display:flex; flex-direction:column;
    box-shadow:0 2px 14px rgba(43,42,39,.05); will-change:transform; touch-action:none}
  .card.back{transform:scale(.955) translateY(12px); opacity:.55; pointer-events:none;
    background:#F6F3EA; box-shadow:0 1px 8px rgba(43,42,39,.04)}
  .card.front{cursor:grab}
  .card.front.dragging{cursor:grabbing}
  .card.fly{transition:transform .26s cubic-bezier(.3,.7,.4,1), opacity .26s ease}
  .card.pop{animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.975)} to{transform:scale(1)}}
  .card .head{display:flex; align-items:center; gap:8px; margin-bottom:auto}
  .badge{display:inline-block; padding:1.5px 8px; border-radius:5px; font-size:11px;
    font-weight:600; letter-spacing:.03em}
  .badge.A{color:var(--a); background:var(--a-bg)}
  .badge.B{color:var(--b); background:var(--b-bg)}
  .badge.C{color:var(--c); background:var(--c-bg)}
  .card .head .len{margin-left:auto; font-size:11.5px; color:var(--ink-3)}
  .card .q{font-family:"Songti SC","STSong","SimSun",Georgia,serif; font-size:19px;
    line-height:1.95; letter-spacing:.02em; margin:16px 0; flex:1; display:flex; align-items:center}
  .card .q span{display:block}
  .card .foot{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-3)}
  .card .foot .why{margin-left:auto; max-width:52%; text-align:right; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .stamp{position:absolute; top:20px; padding:5px 14px; border-radius:6px; font-size:15px;
    font-weight:600; letter-spacing:.08em; border:2px solid; opacity:0; transition:opacity .1s}
  .stamp.yes{right:26px; color:var(--keep); border-color:var(--keep); transform:rotate(9deg)}
  .stamp.no{left:26px; color:var(--drop); border-color:var(--drop); transform:rotate(-9deg)}

  .actions{position:absolute; left:0; right:0; bottom:40px; display:flex;
    align-items:center; justify-content:center; gap:16px}
  .round{width:56px; height:56px; border-radius:50%; border:1px solid var(--line-2);
    background:#fff; cursor:pointer; font-size:19px; color:var(--ink-2);
    display:flex; align-items:center; justify-content:center; transition:.12s;
    box-shadow:0 1px 6px rgba(43,42,39,.06)}
  .round:hover{transform:translateY(-1px); box-shadow:0 3px 12px rgba(43,42,39,.10)}
  .round.no{color:var(--drop); border-color:#E6D3B0}
  .round.yes{color:var(--keep); border-color:#CFDCBB}
  .round.small{width:40px; height:40px; font-size:14px; box-shadow:none;
    background:transparent; border-color:transparent}
  .round.small:hover{background:#F4F2ED; transform:none; box-shadow:none}
  .progress{position:absolute; bottom:16px; left:0; right:0; text-align:center;
    font-size:12px; color:var(--ink-3)}
  .progress b{color:var(--ink-2)}

  .done{position:absolute; inset:0; display:none; align-items:center; justify-content:center}
  .done.show{display:flex}
  .done .box{text-align:center; max-width:440px; padding:0 20px}
  .done h2{font-size:20px; margin:0 0 10px; font-weight:600}
  .done p{font-size:13.5px; color:var(--ink-2); line-height:1.9; margin:0 0 22px}
  .done .big{border:0; border-radius:9px; background:var(--accent); color:#fff;
    padding:12px 26px; font-size:14px; font-family:inherit; cursor:pointer}
  .done .big:hover{background:#2A4157}

  .overlay{position:fixed; inset:0; background:rgba(43,42,39,.42); display:none;
    align-items:center; justify-content:center; z-index:60; padding:24px}
  .overlay.show{display:flex}
  .panel{background:#fff; border-radius:14px; padding:28px 32px; max-width:460px; width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.16)}
  .panel h3{margin:0 0 10px; font-size:16px; font-weight:600}
  .panel p{margin:0 0 15px; font-size:13px; color:var(--ink-2); line-height:1.8}
  .panel p b{color:var(--accent); font-size:15px}
  .panel textarea{width:100%; min-height:60px; resize:vertical; padding:10px 12px; font-size:13px;
    border:1px solid var(--line-2); border-radius:8px; font-family:inherit; color:var(--ink);
    outline:none; line-height:1.6; user-select:text}
  .panel textarea:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px; justify-content:flex-end; margin-top:16px; align-items:center}
  .row .btn{border:0; border-radius:8px; padding:9px 18px; font-size:13px;
    font-family:inherit; cursor:pointer}
  .row .btn.primary{background:var(--accent); color:#fff}
  .row .btn.primary:hover{background:#2A4157}
  .row .btn.ghost2{background:transparent; color:var(--ink-2); border:1px solid var(--line-2)}
  .row .btn.go{background:var(--keep); color:#fff; text-decoration:none}
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <h1>划卡选句</h1>
    <span class="hint">← 不留 · → 留下 · Z 撤销</span>
    <span class="spacer"></span>
    <button class="ghost" id="submitTop" disabled>导出</button>
    <button class="ghost" id="undo" disabled>撤销</button>
    <button class="ghost" id="restart">重新开始</button>
  </div>
  <div class="toolbar">
    <div class="seg" id="tierSeg">
      <button data-t="all" class="on">全部</button>
      <button data-t="A">A 级</button>
      <button data-t="B">B 级</button>
      <button data-t="C">C 级</button>
    </div>
    <div class="seg" id="whoSeg"></div>
    <input type="search" id="q" placeholder="搜句子里的词…">
  </div>
</div>

<div class="stage">
  <div class="deck" id="deck">
    <div class="card back" id="cardBack"></div>
    <div class="card front" id="cardFront"></div>
  </div>
  <div class="done" id="done"></div>
</div>

<div class="actions" id="actions">
  <button class="round small" id="undo2" title="撤销">↶</button>
  <button class="round no" id="btnNo" title="不留">✕</button>
  <button class="round yes" id="btnYes" title="留下">✓</button>
</div>

<div class="progress" id="prog"></div>
<div class="overlay" id="ov"><div class="panel" id="panel"></div></div>

<script>
/* 数据内嵌：由构建脚本从台账生成 */
let DATA = null;

const $ = s => document.querySelector(s);
const LS = 'sentence_swipe_standalone_v1';
let items = [], decided = new Map(), undoStack = [], pos = 0, queue = [];
let tier = 'all', who = 'all', q = '';
let dragging = false, startX = 0, startY = 0, dx = 0, dy = 0, busy = false;

function loadDecided(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw) JSON.parse(raw).forEach(([sid, d]) => decided.set(sid, d));
  }catch(e){}
}
function saveDecided(){
  localStorage.setItem(LS, JSON.stringify([...decided]));
}
function match(it){
  if(tier !== 'all' && it.tier !== tier) return false;
  if(who !== 'all' && it.who !== who) return false;
  if(q && !it.text.includes(q) && !(it.reason || '').includes(q)) return false;
  return true;
}
function buildQueue(){
  queue = items.filter(it => !decided.has(it.sid) && match(it));
  pos = 0;
  render();
}

function fillCard(el, it){
  el.innerHTML = '';
  if(!it) return;
  const head = document.createElement('div');
  head.className = 'head';
  const b = document.createElement('span');
  b.className = 'badge ' + it.tier;
  b.textContent = it.tier + ' 级';
  head.appendChild(b);
  const len = document.createElement('span');
  len.className = 'len';
  len.textContent = it.n + ' 字';
  head.appendChild(len);
  el.appendChild(head);

  const qq = document.createElement('div');
  qq.className = 'q';
  const sp = document.createElement('span');
  sp.textContent = it.text;
  qq.appendChild(sp);
  el.appendChild(qq);

  const foot = document.createElement('div');
  foot.className = 'foot';
  const w = document.createElement('span');
  w.textContent = it.date + ' · ' + it.who;
  foot.appendChild(w);
  if(it.reason){
    const why = document.createElement('span');
    why.className = 'why';
    why.textContent = it.reason;
    foot.appendChild(why);
  }
  el.appendChild(foot);

  const yes = document.createElement('div');
  yes.className = 'stamp yes'; yes.id = 'stampYes'; yes.textContent = '留下';
  const no = document.createElement('div');
  no.className = 'stamp no'; no.id = 'stampNo'; no.textContent = '不留';
  el.appendChild(yes); el.appendChild(no);
}

function updateTop(){
  const kept = [...decided.values()].filter(v => v === 'keep').length;
  const b = $('#submitTop');
  b.textContent = kept ? '导出 (' + kept + ')' : '导出';
  b.disabled = kept === 0;
}
function updateProg(){
  const kept = [...decided.values()].filter(v => v === 'keep').length;
  const dropped = [...decided.values()].filter(v => v === 'drop').length;
  $('#prog').innerHTML = queue.length
    ? '第 <b>' + (pos + 1) + '</b> / ' + queue.length + ' 句 · 留下 <b>' + kept + '</b> · 不留 <b>' + dropped + '</b>'
    : '留下 <b>' + kept + '</b> · 不留 <b>' + dropped + '</b>';
}

function render(){
  const front = $('#cardFront'), back = $('#cardBack');
  front.classList.remove('fly');
  front.style.transform = '';
  front.style.opacity = '';
  const cur = queue[pos], nxt = queue[pos + 1];

  if(!cur){
    $('#deck').style.display = 'none';
    $('#actions').style.display = 'none';
    showDone(); updateTop(); updateProg();
    return;
  }
  $('#deck').style.display = '';
  $('#actions').style.display = '';
  $('#done').classList.remove('show');
  fillCard(front, cur);
  back.style.display = nxt ? '' : 'none';
  fillCard(back, null);
  front.classList.remove('pop');
  void front.offsetWidth;
  front.classList.add('pop');
  $('#undo').disabled = !undoStack.length;
  $('#undo2').disabled = !undoStack.length;
  updateTop(); updateProg();
}

function setStamps(v){
  const y = $('#stampYes'), n = $('#stampNo');
  if(!y) return;
  y.style.opacity = v > 0 ? Math.min(v / 90, 1) : 0;
  n.style.opacity = v < 0 ? Math.min(-v / 90, 1) : 0;
}

function flyAndDecide(dir){
  if(busy) return;
  const it = queue[pos];
  if(!it) return;
  busy = true;
  const front = $('#cardFront');
  const out = dir === 'keep' ? 1 : -1;
  front.classList.add('fly');
  front.style.transform = 'translateX(' + (out * 640) + 'px) rotate(' + (out * 16) + 'deg)';
  front.style.opacity = '0';
  decided.set(it.sid, dir);
  undoStack.push(it);
  pos++;
  saveDecided();
  setTimeout(() => { busy = false; render(); }, 240);
}

function undo(){
  if(busy || !undoStack.length) return;
  const it = undoStack.pop();
  decided.delete(it.sid);
  pos = Math.max(0, pos - 1);
  saveDecided();
  render();
}

function showDone(){
  const kept = [...decided.values()].filter(v => v === 'keep').length;
  const dropped = [...decided.values()].filter(v => v === 'drop').length;
  const el = $('#done');
  el.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'box';
  const h = document.createElement('h2');
  h.textContent = kept ? '留下 ' + kept + ' 句' : '这一轮没留下句子';
  const p = document.createElement('p');
  p.textContent = kept
    ? '跳过 ' + dropped + ' 句。选择存在浏览器本地，关掉页面不会丢。'
    : '跳过 ' + dropped + ' 句。可以换筛选条件再滑一轮，或者点「重新开始」清空。';
  const btn = document.createElement('button');
  btn.className = 'big';
  btn.textContent = kept ? '生成 TXT' : '换条件再看';
  btn.onclick = () => kept ? openExport() : $('#done').classList.remove('show');
  box.appendChild(h); box.appendChild(p); box.appendChild(btn);
  el.appendChild(box);
  el.classList.add('show');
}

function keptItems(){
  const keep = new Set([...decided].filter(([, v]) => v === 'keep').map(([k]) => k));
  const order = {A:0, B:1, C:2};
  return items.filter(i => keep.has(i.sid))
    .sort((a, b) => (order[a.tier] - order[b.tier]) || a.date.localeCompare(b.date));
}

function buildTxt(chosen, note){
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const L = [];
  L.push('句子选集');
  L.push('共 ' + chosen.length + ' 句 · ' + stamp);
  L.push('');
  L.push('='.repeat(34));
  L.push('');
  chosen.forEach((c, i) => {
    L.push(String(i + 1).padStart(2, '0'));
    L.push('');
    L.push(c.text);
    L.push('');
    L.push('—— ' + c.who + '  ' + c.date);
    L.push('');
    L.push('-'.repeat(34));
    L.push('');
  });
  L.push('');
  L.push('【纯文本】');
  L.push('');
  chosen.forEach(c => L.push(c.text));
  if(note){ L.push(''); L.push('备注：' + note); }
  return L.join('\n') + '\n';
}

function download(txt, name){
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openExport(){
  const chosen = keptItems();
  const p = $('#panel');
  p.innerHTML = '<h3>导出</h3>'
    + '<p>已留下 <b>' + chosen.length + '</b> 句。可以留一句备注，会写在 TXT 末尾。</p>'
    + '<textarea id="note" placeholder="选填"></textarea>'
    + '<div class="row"><button class="btn ghost2" id="cancel">再看看</button>'
    + '<button class="btn ghost2" id="copy">复制全文</button>'
    + '<button class="btn primary" id="dl">下载 TXT</button></div>';
  $('#ov').classList.add('show');
  $('#cancel').onclick = () => $('#ov').classList.remove('show');
  const txt = () => buildTxt(chosen, $('#note').value.trim());
  $('#dl').onclick = () => {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    download(txt(), '句子选集-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.txt');
    $('#dl').textContent = '已下载';
  };
  $('#copy').onclick = async () => {
    try{
      await navigator.clipboard.writeText(txt());
      $('#copy').textContent = '已复制';
    }catch(e){
      $('#copy').textContent = '复制失败';
    }
  };
}

function bindDrag(){
  const el = $('#cardFront');
  el.addEventListener('pointerdown', e => {
    if(busy || !queue[pos]) return;
    dragging = true; startX = e.clientX; startY = e.clientY; dx = 0; dy = 0;
    el.classList.remove('fly');
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if(!dragging) return;
    dx = e.clientX - startX; dy = e.clientY - startY;
    el.style.transform = 'translate(' + dx + 'px,' + (dy * .25) + 'px) rotate(' + (dx / 22) + 'deg)';
    setStamps(dx);
  });
  const end = () => {
    if(!dragging) return;
    dragging = false;
    const f = $('#cardFront');
    f.classList.remove('dragging');
    if(Math.abs(dx) > 92){
      flyAndDecide(dx > 0 ? 'keep' : 'drop');
    }else{
      f.classList.add('fly');
      f.style.transform = '';
      setStamps(0);
    }
    dx = 0; dy = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

$('#btnYes').onclick = () => flyAndDecide('keep');
$('#btnNo').onclick = () => flyAndDecide('drop');
$('#undo').onclick = undo;
$('#undo2').onclick = undo;
$('#submitTop').onclick = openExport;

$('#restart').onclick = () => {
  if(!confirm('清空全部选择，从头开始？')) return;
  decided.clear(); undoStack = []; saveDecided(); buildQueue();
};

function bindSeg(sel, key, cb){
  document.querySelectorAll(sel + ' button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll(sel + ' button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      cb(b.dataset[key]);
    });
  });
}
function refilter(fn){ fn(); undoStack = []; buildQueue(); }
bindSeg('#tierSeg', 't', v => refilter(() => tier = v));

$('#q').addEventListener('input', e => refilter(() => q = e.target.value.trim()));

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); flyAndDecide('keep'); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); flyAndDecide('drop'); }
  else if(e.key === 'z' || e.key === 'Z'){ e.preventDefault(); undo(); }
});

function buildWhoSeg(){
  const el = document.getElementById('whoSeg');
  el.innerHTML = '';
  const names = [];
  items.forEach(it => { if(!names.includes(it.who)) names.push(it.who); });
  const mk = (val, label) => {
    const b = document.createElement('button');
    b.dataset.w = val;
    b.textContent = label;
    if(who === val) b.classList.add('on');
    el.appendChild(b);
  };
  mk('all', '全部');
  names.forEach(n => mk(n, n));
  bindSeg('#whoSeg', 'w', v => refilter(() => who = v));
}

function start(){
  items = DATA.slice();
  buildWhoSeg();
  loadDecided();
  bindDrag();
  buildQueue();

    + 'style="width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line-2);'
    + 'border-radius:8px;outline:none;font-family:inherit;color:var(--ink)">'
    + '<div id="err" style="color:#A32D2D;font-size:12.5px;margin-top:10px;min-height:18px"></div>'
    + '<div class="row"><button class="btn primary" id="go">进入</button></div>'
    + '</div>';
  document.body.appendChild(ov);

  const pw = ov.querySelector('#pw');
  const err = ov.querySelector('#err');
  const go = ov.querySelector('#go');

  if(!window.crypto || !window.crypto.subtle){
    err.textContent = '当前页面不是安全上下文（需 https 或本地文件），无法解密。';
    go.disabled = true;
    return;
  }
  pw.focus();

  function b64(s){
    const bin = atob(s);
    const u = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  async function unlock(){
    const v = pw.value;
    if(!v) return;
    go.disabled = true;
    go.textContent = '验证中…';
    err.textContent = '';
    try{
      const raw = b64(ENC.ct);
      const salt = raw.slice(8, 16);
      const ct = raw.slice(16);
      const base = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await crypto.subtle.deriveBits(
        {name:'PBKDF2', salt, iterations: ENC.iter, hash:'SHA-256'}, base, 384));
      const key = await crypto.subtle.importKey(
        'raw', bits.slice(0, 32), {name:'AES-CBC'}, false, ['decrypt']);
      const pt = await crypto.subtle.decrypt(
        {name:'AES-CBC', iv: bits.slice(32, 48)}, key, ct);
      const text = new TextDecoder().decode(pt);
      const parsed = JSON.parse(text);
      if(!Array.isArray(parsed)) throw new Error('bad payload');
      DATA = parsed;
      ov.remove();
      start();
    }catch(e){
      err.textContent = '口令不对，或者文件被改动过。';
      go.disabled = false;
      go.textContent = '进入';
      pw.select();
    }
  }

  go.onclick = unlock;
  pw.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
})();

</script>
</body>
</html>
